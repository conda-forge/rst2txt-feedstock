{% set version = "1.2.0" %}

package:
  name: rst2txt
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/rst2txt/rst2txt-{{ version }}.tar.gz
  sha256: d3f2cfa9fc4afdc6c8ea88a1a6157077915f723c92d48618bd2690b813f19e2f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - rst2txt = rst2txt:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=30.3.0
    - setuptools-scm
  run:
    - docutils >=0.11
    - pygments
    - python >={{ python_min }}

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - rst2txt
  commands:
    - pip check
    - rst2txt --help

about:
  home: https://github.com/stephenfin/rst2txt
  summary: Convert reStructuredText to plain text
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bollwyvl
